name: Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  build-images:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: docker/api.Dockerfile
          - app: web
            dockerfile: docker/web.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.app }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: financehub-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Scan the built image for known OS/library vulnerabilities. Advisory
      # (non-blocking) so a fresh CVE can't wedge merges; review the SARIF report.
      - name: Scan image (${{ matrix.app }})
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: financehub-${{ matrix.app }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
