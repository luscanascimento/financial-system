server {
    # Unprivileged nginx listens on 8080 (no root / NET_BIND_SERVICE needed).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security response headers (sent on every response) ─────────────────────
    # Restrictive CSP for the Angular SPA: same-origin only. The API is reached
    # through the /api reverse proxy, so 'self' covers connect-src.
    # 'unsafe-inline' in style-src is required for Angular's runtime-injected
    # component styles — it does NOT relax script-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Honoured only over HTTPS (ignored on plain HTTP) — safe to always send when
    # TLS is terminated by an upstream load balancer.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy API traffic to the NestJS container. The API mounts its
    # routes under /api, so the prefix is preserved end-to-end.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache hashed build assets. Caching is set via `expires` (not
    # `add_header`) so the server-level security headers are still inherited
    # here — a literal add_header in this block would drop them.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback — every other route resolves to the Angular entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
