<mat-toolbar class="fh-toolbar">
  <a class="fh-brand" routerLink="/dashboard">
    <mat-icon aria-hidden="true">account_balance_wallet</mat-icon>
    <span class="fh-brand__name">FinanceHub</span>
  </a>

  <nav class="fh-nav" aria-label="Primary">
    <a
      mat-button
      routerLink="/dashboard"
      routerLinkActive="fh-nav__link--active"
    >
      Dashboard
    </a>
  </nav>

  <span class="fh-toolbar__spacer"></span>

  <button
    mat-icon-button
    type="button"
    [matTooltip]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    (click)="toggleTheme()"
  >
    <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<main class="fh-content">
  <router-outlet></router-outlet>
</main>
